# props.conf for dsh-ocsf-forwarder's Splunk HEC output.
#
# Drop this into $SPLUNK_HOME/etc/apps/<your app>/local/props.conf on the
# search head (and on indexers, for the index-time settings).
#
# There is no official Splunk add-on for OCSF and no Splunk-published OCSF
# sourcetype convention, so the sourcetypes below are ours: `ocsf:<class name>`,
# where the class name is OCSF's own `name` for the class rather than its
# caption. Splunk's one piece of prior art for OCSF-shaped data is `aws:asl`,
# which the Splunk Add-on for AWS uses for Amazon Security Lake; it is
# AWS-specific and not a general convention. Change `sourcetypePrefix` in the
# plugin's configuration if `ocsf` collides with something you already index.
#
# There is deliberately no transforms.conf beside this file. HEC sets `_time`,
# `host`, `source` and `sourcetype` from the event envelope, and the payload is
# JSON, so every field is available at search time from KV_MODE alone. Nothing
# needs an index-time transform.

[default]

# Every record is one JSON object. Search-time extraction reaches the nested
# OCSF attributes as `metadata.uid`, `unmapped.dsh.tool` and so on.
[ocsf:process_activity]
KV_MODE = json
SHOULD_LINEMERGE = false
# A record carrying a long argument list must not be cut in half.
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 Process Activity (1007) from DeepSeek Harness sessions

[ocsf:file_activity]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 File System Activity (1001) from DeepSeek Harness sessions

[ocsf:scheduled_job_activity]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 Scheduled Job Activity (1006) from DeepSeek Harness sessions

[ocsf:authorize_session]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 Authorize Session (3003) from DeepSeek Harness sessions

[ocsf:http_activity]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 HTTP Activity (4002) from DeepSeek Harness sessions

[ocsf:application_lifecycle]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 Application Lifecycle (6002) from DeepSeek Harness sessions, including the forwarder heartbeat

[ocsf:api_activity]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 API Activity (6003) from DeepSeek Harness sessions

# A class this build of the plugin does not name falls here, so a schema
# addition shows up as data rather than as a gap.
[ocsf:base_event]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = OCSF 1.9.0 record whose class the forwarder does not name
